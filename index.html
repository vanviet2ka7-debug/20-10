<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng 20/10</title>
<style>
:root{--bg1:#07050c;--bg2:#1a0f2b;--card:rgba(30,20,44,.82);--text:#ffe3ee;--accent:#ff7fae;--muted:#c9a3b8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{position:relative;z-index:2;width:calc(100% - 32px);max-width:520px;max-height:88%;overflow-y:auto;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:24px;padding:28px 24px;box-shadow:0 12px 40px rgba(224,69,123,.25);text-align:center;box-sizing:border-box}
h1{margin:0 0 6px;font-size:1.6rem;color:var(--accent)}
.sub{margin:0 0 18px;color:var(--muted);font-size:.95rem}
input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;border:2px solid var(--accent);background:transparent;color:var(--text);font-size:1rem;text-align:center;outline:none;margin-bottom:14px}
input::placeholder{color:var(--muted)}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:1rem;cursor:pointer;font-family:inherit}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);margin-top:16px}
#msg{white-space:pre-wrap;text-align:left;line-height:1.7;font-size:1.08rem;min-height:3em}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hidden{display:none}
.petal{position:fixed;top:-40px;z-index:1;pointer-events:none;animation:fall linear forwards}
.fx{position:fixed;z-index:5;pointer-events:none;white-space:nowrap;will-change:transform,opacity;color:var(--accent);font-weight:600}
.ripple{width:120px;height:120px;border-radius:50%;border:3px solid var(--accent);box-sizing:border-box}
#hint{margin:14px 0 0}
@keyframes fall{to{transform:translate3d(var(--dx),115vh,0) rotate(var(--r))}}
</style>
</head>
<body>
<div class="card" id="intro">
  <h1>🌸 Chúc mừng 20/10 🌸</h1>
  <p class="sub">Nhập tên người nhận để mở lời chúc nhé</p>
  <input id="name" type="text" maxlength="30" placeholder="Tên bạn của bạn…" autocomplete="off">
  <button id="go">Mở lời chúc 💌</button>
</div>

<div class="card hidden" id="wish">
  <div id="msg"></div>
  <p class="sub hidden" id="hint">Chạm vào màn hình thử xem ✨</p>
  <button class="ghost hidden" id="again">Xem lại 🌷</button>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var flowers = ["🌸","🌷","🌹","🌺","💮","🌼"];
  var timer = null, typing = 0;

  function petal(){
    if(document.querySelectorAll(".petal").length > 40) return;
    var p = document.createElement("span");
    p.className = "petal";
    p.textContent = flowers[Math.floor(Math.random()*flowers.length)];
    p.style.left = Math.random()*100 + "vw";
    p.style.fontSize = (14 + Math.random()*18) + "px";
    p.style.setProperty("--dx", (Math.random()*160-80) + "px");
    p.style.setProperty("--r", (Math.random()*720-360) + "deg");
    var d = 6 + Math.random()*6;
    p.style.animationDuration = d + "s";
    document.body.appendChild(p);
    setTimeout(function(){p.remove()}, d*1000 + 100);
  }
  function startPetals(){ if(!timer){ for(var i=0;i<12;i++) petal(); timer = setInterval(petal, 450); } }

  function buildText(name){
    var who = name ? name : "bạn";
    return "Gửi " + who + ",\n\n" +
      "Nhân ngày 20/10, chúc " + who + " luôn xinh đẹp, rạng rỡ và thật nhiều niềm vui mỗi ngày.\n\n" +
      "Chúc mọi điều " + who + " mong muốn đều thành sự thật, công việc suôn sẻ, tiền vào như nước và luôn được yêu thương.\n\n" +
      "Cảm ơn vì đã luôn ở bên cạnh mình. Chúc mừng ngày Phụ nữ Việt Nam! 💐";
  }

  function type(text){
    var el = $("msg"), btn = $("again");
    var id = ++typing, chars = Array.from(text), i = 0;
    el.textContent = "";
    btn.classList.add("hidden"); $("hint").classList.add("hidden");
    var cur = document.createElement("span");
    cur.className = "cursor";
    var node = document.createTextNode("");
    el.appendChild(node); el.appendChild(cur);
    (function step(){
      if(id !== typing) return;
      if(i >= chars.length){ btn.classList.remove("hidden"); $("hint").classList.remove("hidden"); return; }
      var c = chars[i++];
      node.nodeValue += c;
      var delay = 45 + Math.random()*55;
      if(c === "," ) delay += 250;
      if(c === "." || c === "!" ) delay += 450;
      if(c === "\n") delay += 200;
      setTimeout(step, delay);
    })();
  }

  var current = "";
  function open(){
    current = buildText($("name").value.trim());
    $("intro").classList.add("hidden");
    $("wish").classList.remove("hidden");
    startPetals();
    type(current);
  }
  $("go").addEventListener("click", open);
  $("name").addEventListener("keydown", function(e){ if(e.key === "Enter") open(); });
  $("again").addEventListener("click", function(){ type(current); });

  /* Hiệu ứng khi chạm màn hình */
  var fxN = 0;
  var words = ["Xinh đẹp!","Hạnh phúc!","Yêu thương!","Rạng rỡ!","Luôn vui nhé!","20/10 💖"];
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function fly(x,y,txt,dx,dy,dur,size,rot){
    var el = document.createElement("span");
    el.className = "fx"; el.textContent = txt;
    el.style.left = x + "px"; el.style.top = y + "px"; el.style.fontSize = size + "px";
    document.body.appendChild(el);
    var a = el.animate([
      {transform:"translate(-50%,-50%) scale(.3) rotate(0deg)", opacity:1},
      {transform:"translate(calc(-50% + " + dx + "px),calc(-50% + " + dy + "px)) scale(1) rotate(" + (rot||0) + "deg)", opacity:0}
    ],{duration:dur, easing:"cubic-bezier(.15,.7,.3,1)", fill:"forwards"});
    a.onfinish = function(){ el.remove(); };
  }
  function ripple(x,y){
    var el = document.createElement("span");
    el.className = "fx ripple";
    el.style.left = x + "px"; el.style.top = y + "px";
    document.body.appendChild(el);
    var a = el.animate([
      {transform:"translate(-50%,-50%) scale(.2)", opacity:.9},
      {transform:"translate(-50%,-50%) scale(1.2)", opacity:0}
    ],{duration:700, easing:"ease-out"});
    a.onfinish = function(){ el.remove(); };
  }
  var effects = [
    function(x,y){ /* tim bay lên */
      var h = ["💖","💗","💕","💘"];
      for(var i=0;i<9;i++) fly(x,y,h[i%4],rnd(-90,90),rnd(-260,-120),rnd(1100,1800),rnd(18,32),rnd(-30,30));
    },
    function(x,y){ /* hoa nở tỏa tròn */
      for(var i=0;i<12;i++){ var t=i/12*Math.PI*2, r=rnd(80,140); fly(x,y,flowers[i%flowers.length],Math.cos(t)*r,Math.sin(t)*r,1000,rnd(20,30),rnd(-180,180)); }
    },
    function(x,y){ /* lấp lánh */
      ripple(x,y);
      for(var i=0;i<14;i++){ var t=rnd(0,6.28), r=rnd(40,120); fly(x,y,"✨",Math.cos(t)*r,Math.sin(t)*r,rnd(700,1100),rnd(12,24),0); }
    },
    function(x,y){ /* lời chúc bay lên */
      fly(x,y,words[Math.floor(Math.random()*words.length)],0,-140,1600,rnd(24,34),0);
      for(var i=0;i<4;i++) fly(x,y,"🌸",rnd(-60,60),rnd(-90,-30),1200,18,rnd(-90,90));
    },
    function(x,y){ /* pháo hoa */
      ripple(x,y);
      var s = ["🎆","🎇","💫","⭐","🌟"];
      for(var i=0;i<10;i++){ var t=i/10*Math.PI*2, r=rnd(90,150); fly(x,y,s[i%s.length],Math.cos(t)*r,Math.sin(t)*r+30,1100,rnd(16,26),0); }
    }
  ];
  document.addEventListener("pointerdown", function(e){
    if(e.target.closest("button,input")) return;
    effects[fxN++ % effects.length](e.clientX, e.clientY);
  });
})();
</script>
</body>
</html>
